name: Feature request
description: Suggest an option or a card this project does not have yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to show or do?
      description: Describe the situation on your dashboard, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed option or behaviour
  - type: markdown
    attributes:
      value: |
        Scope: calm status and control cards without third-party libraries.
        Room tiles switch lights only; charts beyond one sparkline are out of scope.