version: 2
updates:
  - package-ecosystem: "github-actions"
    # Propose new versions only after 14 days (supply chain);
    # security updates are not delayed.
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Development only: the DOM used by the tests. Nothing from npm is shipped.
  - package-ecosystem: "npm"
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
